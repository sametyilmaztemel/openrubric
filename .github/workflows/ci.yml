name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift test + build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests (OpenRubricCore)
        run: swift test --parallel
      - name: Build menu bar app (OpenRubric)
        run: swift build --product OpenRubric
      - name: Assemble .app bundle (Info.plist)
        run: |
          mkdir -p build/OpenRubric.app/Contents/MacOS
          cp .build/debug/OpenRubric build/OpenRubric.app/Contents/MacOS/
          cp Resources/Info.plist build/OpenRubric.app/Contents/
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/OpenRubric.app/Contents/Info.plist
